<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JALA Student Skills</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="login-wrapper">
    <div class="login-box">
        <h2>🎓 JALA Technologies</h2>
        <p>Student Skills Management System</p>
        <p style="margin-bottom:20px; color:#888; font-size:12px;">Admin Login Only</p>
        {% for message in messages %}<div class="alert alert-error">{{ message }}</div>{% endfor %}
        <form method="POST">
            {% csrf_token %}
            <div class="form-group"><label>User Name</label><input type="text" name="username" placeholder="Enter username" required autofocus></div>
            <div class="form-group"><label>Password</label><input type="password" name="password" placeholder="Enter password" required></div>
            <div style="text-align:right; margin-bottom:18px;"><a href="#" style="font-size:13px; color:#1a237e; text-decoration:none;">Forgot Password?</a></div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <div style="text-align:center; margin-top:20px; font-size:13px; color:#666;">
            <a href="{% url 'register_student' %}" style="color:#1a237e;">📝 Student Registration</a> |
            <a href="{% url 'parent_portal' %}" style="color:#1a237e;">👨‍👩‍👧 Parent Portal</a> |
            <a href="{% url 'feedback' %}" style="color:#1a237e;">💬 Feedback</a>
        </div>
    </div>
</div>
</body>
</html>
