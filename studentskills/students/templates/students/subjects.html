{% extends 'students/base.html' %}
{% block title %}Manage Subjects{% endblock %}
{% block content %}
<div class="form-row" style="align-items:start;">
    <div class="card">
        <div class="card-title">📚 Add Subject</div>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group"><label>Subject Code *</label><input type="text" name="code" required></div>
            <div class="form-group"><label>Subject Name *</label><input type="text" name="name" required></div>
            <button type="submit" class="btn btn-success">Add Subject</button>
        </form>
    </div>
    <div class="card">
        <div class="card-title">📋 All Subjects</div>
        <div class="table-wrapper"><table><thead><tr><th>Code</th><th>Name</th></tr></thead>
        <tbody>{% for s in subjects %}<tr><td>{{ s.code }}</td><td>{{ s.name }}</td></tr>{% empty %}<tr><td colspan="2" style="text-align:center;color:#999;">No subjects yet.</td></tr>{% endfor %}</tbody></table></div>
    </div>
</div>
{% endblock %}
