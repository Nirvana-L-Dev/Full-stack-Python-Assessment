{% extends 'students/base.html' %}
{% block title %}Add Marks{% endblock %}
{% block content %}
<div class="card" style="max-width:500px; margin:0 auto;">
    <div class="card-title">📊 Add Marks — {{ student.first_name }} {{ student.last_name }}</div>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group"><label>Subject *</label>
            <select name="subject" required>
                <option value="">-- Select Subject --</option>
                {% for s in subjects %}<option value="{{ s.pk }}">{{ s.name }}</option>{% endfor %}
            </select>
        </div>
        <div class="form-group"><label>Exam Type *</label>
            <select name="exam_type">
                <option value="Mid Term">Mid Term</option>
                <option value="Final Exam">Final Exam</option>
                <option value="Quiz">Quiz</option>
                <option value="Assignment">Assignment</option>
            </select>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Marks Obtained *</label><input type="number" name="marks_obtained" step="0.01" min="0" required></div>
            <div class="form-group"><label>Max Marks</label><input type="number" name="max_marks" value="100" min="1"></div>
        </div>
        <div style="display:flex; gap:12px;">
            <button type="submit" class="btn btn-success">Add Marks</button>
            <a href="{% url 'student_report' student.pk %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
