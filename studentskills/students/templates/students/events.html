{% extends 'students/base.html' %}
{% block title %}Manage Events{% endblock %}
{% block content %}
<div class="form-row" style="align-items:start;">
    <div class="card">
        <div class="card-title">📅 Add Event</div>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group"><label>Title *</label><input type="text" name="title" required></div>
            <div class="form-group"><label>Event Type *</label>
                <select name="event_type">
                    <option value="Fee">Fee Due</option><option value="Exam">Exam</option>
                    <option value="Result">Result</option><option value="Cultural">Cultural</option>
                    <option value="Sports">Sports</option><option value="Holiday">Holiday</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group"><label>Date *</label><input type="date" name="event_date" required></div>
            <div class="form-group"><label>Description</label><textarea name="description" rows="3"></textarea></div>
            <button type="submit" class="btn btn-success">Add Event</button>
        </form>
    </div>
    <div class="card">
        <div class="card-title">📋 All Events</div>
        <div class="table-wrapper"><table><thead><tr><th>Title</th><th>Type</th><th>Date</th></tr></thead>
        <tbody>{% for e in events %}<tr><td>{{ e.title }}</td><td>{{ e.event_type }}</td><td>{{ e.event_date }}</td></tr>{% empty %}<tr><td colspan="3" style="text-align:center;color:#999;">No events yet.</td></tr>{% endfor %}</tbody></table></div>
    </div>
</div>
{% endblock %}
