{% extends 'students/base.html' %}
{% block title %}Feedback & Complaints{% endblock %}
{% block content %}
<div class="card" style="max-width:600px; margin:0 auto;">
    <div class="card-title">💬 Feedback & Complaints</div>
    <form method="POST">
        {% csrf_token %}
        <div class="form-row">
            <div class="form-group"><label>Your Name *</label><input type="text" name="name" required></div>
            <div class="form-group"><label>Email *</label><input type="email" name="email" required></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Role *</label>
                <select name="role" required>
                    <option value="Student">Student</option>
                    <option value="Parent">Parent</option>
                </select>
            </div>
            <div class="form-group"><label>Type *</label>
                <select name="feedback_type" required>
                    <option value="Feedback">Feedback</option>
                    <option value="Complaint">Complaint</option>
                </select>
            </div>
        </div>
        <div class="form-group"><label>Subject *</label><input type="text" name="subject" required></div>
        <div class="form-group"><label>Message *</label><textarea name="message" rows="5" required></textarea></div>
        <button type="submit" class="btn btn-primary" style="width:auto;">Submit</button>
    </form>
</div>
{% endblock %}
