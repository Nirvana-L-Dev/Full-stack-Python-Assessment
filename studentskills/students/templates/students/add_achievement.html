{% extends 'students/base.html' %}
{% block title %}Add Achievement{% endblock %}
{% block content %}
<div class="card" style="max-width:500px; margin:0 auto;">
    <div class="card-title">🏆 Add Achievement — {{ student.first_name }} {{ student.last_name }}</div>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group"><label>Title *</label><input type="text" name="title" required></div>
        <div class="form-group"><label>Date *</label><input type="date" name="date" required></div>
        <div class="form-group"><label>Description</label><textarea name="description" rows="4"></textarea></div>
        <div style="display:flex; gap:12px;">
            <button type="submit" class="btn btn-success">Add Achievement</button>
            <a href="{% url 'student_report' student.pk %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
